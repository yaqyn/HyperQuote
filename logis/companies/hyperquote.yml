slug: hyperquote
brand:
  name: HyperQuote
  legalName: HyperQuote
  displayName: HyperQuote
domains:
  root: hyperquote.net
  website: www.hyperquote.net
  portal: portal.hyperquote.net
  internal: internal.hyperquote.net
  driver: driver.hyperquote.net
support:
  email: support@hyperquote.net
  url: https://hyperquote.net/support#contact
infisical:
  path: /Projects/HyperQuote
supabase:
  projectId: hyperquote-production
  projectRef: env:SUPABASE_PROJECT_REF
  region: eu-west-1
cloudflare:
  accountId: env:CLOUDFLARE_ACCOUNT_ID
  zoneId: env:CLOUDFLARE_ZONE_ID
apps:
  website:
    directory: apps/website
    workerName: hyperquote-website
    cookieName: hyperquote_customer_auth
    url: https://www.hyperquote.net
    routes:
      - hyperquote.net
      - www.hyperquote.net
    worker:
      main: ./src/server.ts
      assets:
        binding: ASSETS
        run_worker_first: true
  portal:
    directory: apps/portal
    workerName: hyperquote-portal
    cookieName: hyperquote_customer_auth
    url: https://portal.hyperquote.net
    routes:
      - portal.hyperquote.net
    worker:
      main: ./src/server.ts
  internal:
    directory: apps/internal
    workerName: hyperquote-internal
    cookieName: hyperquote_internal_auth
    url: https://internal.hyperquote.net
    routes:
      - internal.hyperquote.net
    worker:
      main: ./src/server.ts
  driver:
    directory: apps/driver
    workerName: hyperquote-driver
    cookieName: hyperquote_driver_auth
    url: https://driver.hyperquote.net
    routes:
      - driver.hyperquote.net
    worker:
      main: ./src/api.ts
      assets:
        binding: ASSETS
        directory: ./dist
        not_found_handling: single-page-application
        run_worker_first:
          - /api/*
cookies:
  customer: hyperquote_customer_auth
  internal: hyperquote_internal_auth
  driver: hyperquote_driver_auth
contentSeeds:
  showcaseBaseline: supabase/showcase-baseline.sql
  localAuth: scripts/seed-local-auth.mjs
