name: Deploy Company

on:
  workflow_dispatch:
    inputs:
      company_slug:
        description: Company registry slug
        required: true
        type: string
      version:
        description: LOGIS release version
        required: true
        default: stable
        type: choice
        options:
          - stable
      request_id:
        description: Signed update request ID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: company-${{ inputs.company_slug }}
  cancel-in-progress: false

env:
  LOGIS_COMPANY_SLUG: ${{ inputs.company_slug }}
  LOGIS_RELEASE_CHANNEL: stable
  LOGIS_VERSION: ${{ github.sha }}
  LOGIS_DEPLOYMENT_ID: ${{ github.run_id }}
  INFISICAL_ENV: prod

jobs:
  deploy:
    name: Deploy ${{ inputs.company_slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: company-${{ inputs.company_slug }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: latest

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate registry
        run: node scripts/logis/validate-registry.mjs "$LOGIS_COMPANY_SLUG"

      - name: Deploy company
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          INFISICAL_PATH="$(node scripts/logis/print-infisical-path.mjs "$LOGIS_COMPANY_SLUG")"
          infisical run --token "$INFISICAL_TOKEN" --env "$INFISICAL_ENV" --path "$INFISICAL_PATH" --recursive -- bun run logis:deploy "$LOGIS_COMPANY_SLUG" --version stable
