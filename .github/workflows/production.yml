name: Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  INFISICAL_PATH: /Projects/HyperQuote
  INFISICAL_ENV: prod

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun run check:ci

      - name: Typecheck
        run: bun run typecheck

      - name: App tests
        run: |
          bun run --cwd apps/website test
          bun run --cwd apps/portal test
          bun run --cwd apps/internal test
          bun run --cwd apps/driver test

      - name: Local Supabase boundary
        run: |
          bun run db:start
          bun run db:reset
          bun run db:api-boundary

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: bunx turbo build --force

      - name: Diff whitespace
        run: git diff --check

  supabase:
    name: Supabase Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migrate production Supabase
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          infisical run --token "$INFISICAL_TOKEN" --env "$INFISICAL_ENV" --path "$INFISICAL_PATH" --recursive -- bash -lc '
            HYPERQUOTE_VERIFY_INFISICAL_ENV=prod bun run secrets:check:production
            bun run deploy:supabase:production
          '

  worker-secrets:
    name: Worker Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: supabase

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync Worker secrets
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          infisical run --token "$INFISICAL_TOKEN" --env "$INFISICAL_ENV" --path "$INFISICAL_PATH" --recursive -- bun run deploy:worker-secrets

      - name: Configure Cloudflare production rules
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          infisical run --token "$INFISICAL_TOKEN" --env "$INFISICAL_ENV" --path "$INFISICAL_PATH" --recursive -- bun run deploy:cloudflare-rules:production

  workers:
    name: Deploy ${{ matrix.app }} Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: worker-secrets
    strategy:
      fail-fast: false
      matrix:
        app:
          - website
          - portal
          - internal
          - driver

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Worker
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          infisical run --token "$INFISICAL_TOKEN" --env "$INFISICAL_ENV" --path "$INFISICAL_PATH" --recursive -- bun run --cwd "apps/${{ matrix.app }}" deploy:worker

  smoke:
    name: Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: workers

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke live domains
        run: bun run smoke:production
