name: Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: 8.30.1
  INFISICAL_CLI_VERSION: 0.43.100
  INFISICAL_PATH: /Projects/HyperQuote
  INFISICAL_ENV: prod

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun run check:ci

      - name: PWA installability
        run: bun run pwa:check

      - name: Typecheck
        run: bun run typecheck

      - name: App tests
        run: |
          bun run --cwd apps/website test
          bun run --cwd apps/portal test
          bun run --cwd apps/internal test
          bun run --cwd apps/driver test

      - name: Local Supabase boundary
        run: |
          bun run db:start
          bun run db:reset
          bun run db:api-boundary

      - name: Install Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "/tmp/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd /tmp && sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt")
          tar -xzf "/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan
        run: bun run scan:secrets

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bunx turbo build --force --concurrency=1

      - name: Diff whitespace
        run: git diff --check

  supabase:
    name: Supabase Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Install Infisical CLI
        run: |
          bun add --global "@infisical/cli@${INFISICAL_CLI_VERSION}"
          infisical --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migrate production Supabase
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          infisical run --token "$INFISICAL_TOKEN" --env "$INFISICAL_ENV" --path "$INFISICAL_PATH" --recursive -- bash -lc '
            HYPERQUOTE_VERIFY_INFISICAL_ENV=prod bun run secrets:check:production
            bun run deploy:supabase:production
          '

  worker-secrets:
    name: Worker Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: supabase

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - name: Install Infisical CLI
        run: |
          bun add --global "@infisical/cli@${INFISICAL_CLI_VERSION}"
          infisical --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync Worker secrets
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          infisical run --token "$INFISICAL_TOKEN" --env "$INFISICAL_ENV" --path "$INFISICAL_PATH" --recursive -- bun run deploy:worker-secrets

      - name: Configure Cloudflare production rules
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          infisical run --token "$INFISICAL_TOKEN" --env "$INFISICAL_ENV" --path "$INFISICAL_PATH" --recursive -- bun run deploy:cloudflare-rules:production

  workers:
    name: Deploy ${{ matrix.app }} Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: worker-secrets
    strategy:
      fail-fast: false
      matrix:
        app:
          - website
          - portal
          - internal
          - driver

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - name: Install Infisical CLI
        run: |
          bun add --global "@infisical/cli@${INFISICAL_CLI_VERSION}"
          infisical --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Worker
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          infisical run --token "$INFISICAL_TOKEN" --env "$INFISICAL_ENV" --path "$INFISICAL_PATH" --recursive -- bun run --cwd "apps/${{ matrix.app }}" deploy:worker

  smoke:
    name: Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: workers

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke live domains
        run: bun run smoke:production
