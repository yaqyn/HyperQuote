name: Deploy Staging Workers

on:
  push:
    branches:
      - main
    paths:
      - apps/internal/**
      - apps/portal/**
      - apps/website/**
      - apps/driver/**
      - packages/**
      - scripts/**
      - package.json
      - bun.lock
      - turbo.json
      - .github/workflows/deploy-cloudflare.yml
      - .github/workflows/deploy-production.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.11
  NODE_VERSION: 22

jobs:
  quality-build:
    name: Quality gate and build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VITE_SUPABASE_URL: ${{ vars.STAGING_VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.STAGING_VITE_SUPABASE_ANON_KEY }}
      VITE_MAPTILER_KEY: ${{ vars.STAGING_VITE_MAPTILER_KEY }}
      VITE_INTERNAL_URL: ${{ vars.STAGING_VITE_INTERNAL_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install security scanners
        run: |
          python3 -m pip install --user semgrep
          GOBIN="$HOME/.local/bin" go install github.com/zricethezav/gitleaks/v8@latest
          GOBIN="$HOME/.local/bin" go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Biome
        run: bun run check:ci

      - name: Typecheck
        run: bun run typecheck

      - name: Direct TypeScript coverage
        run: |
          for tsconfig in apps/*/tsconfig.json packages/*/tsconfig.json; do
            echo "::group::tsc ${tsconfig}"
            bunx tsc -p "$tsconfig" --noEmit --pretty false
            echo "::endgroup::"
          done

      - name: Tests
        run: |
          bun run --cwd apps/internal test
          bun run --cwd apps/driver test
          bun run --cwd apps/portal test
          bun run --cwd apps/website test

      - name: Validate staging build environment
        run: bun run deploy:check-env -- --target staging --app all

      - name: Build all apps
        run: bunx turbo build --force

      - name: Remove local dev vars from build output
        run: find apps/website/dist apps/portal/dist apps/internal/dist apps/driver/dist -type f -name ".dev.vars" -delete

      - name: Knip
        run: bun run knip --no-progress

      - name: Dependency sync
        run: bun run sync

      - name: Architecture scan
        run: bun run scan:arch

      - name: Duplicate scan
        run: bun run scan:duplicates

      - name: Secret scan
        run: bun run scan:secrets

      - name: Vulnerability scan
        run: bun run scan:vulns

      - name: Semgrep
        run: bun run scan:semgrep

      - name: Verify sanitized build artifacts
        run: |
          test -f apps/website/dist/server/wrangler.json
          test -f apps/portal/dist/server/wrangler.json
          test -f apps/internal/dist/server/wrangler.json
          test -f apps/driver/wrangler.jsonc
          test -d apps/driver/dist

          if find apps/website/dist apps/portal/dist apps/internal/dist apps/driver/dist \
            -type f \( -name ".dev.vars" -o -name ".env" -o -name "*.pem" -o -name "*.key" \) \
            | grep -q .; then
            echo "::error::Build artifacts contain local secret/config files."
            exit 1
          fi

          if grep -R -q -E "CLOUDFLARE_API_TOKEN=|SUPABASE_SERVICE_ROLE_KEY=|INFISICAL_TOKEN=|BEGIN (RSA|OPENSSH|PRIVATE) KEY" \
            apps/website/dist apps/portal/dist apps/internal/dist apps/driver/dist; then
            echo "::error::Build artifacts contain a secret-like token marker."
            exit 1
          fi

      - name: Upload sanitized build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: staging-workers-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/website/dist/**
            apps/portal/dist/**
            apps/internal/dist/**
            apps/driver/dist/**
            apps/driver/wrangler.jsonc
            !**/.dev.vars
            !**/.env
            !**/*.pem
            !**/*.key

  deploy-staging:
    name: Deploy ${{ matrix.label }} staging
    needs: quality-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: website
            label: Website
            worker: hyperquote-website-staging
            deploy_config: dist/server/wrangler.json
          - app: portal
            label: Portal
            worker: hyperquote-portal-staging
            deploy_config: dist/server/wrangler.json
          - app: internal
            label: Internal
            worker: hyperquote-internal-staging
            deploy_config: dist/server/wrangler.json
          - app: driver
            label: Driver
            worker: hyperquote-driver-staging
            deploy_config: wrangler.jsonc

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download sanitized build artifacts
        uses: actions/download-artifact@v4
        with:
          name: staging-workers-${{ github.sha }}
          path: apps

      - name: Verify deploy config
        working-directory: apps/${{ matrix.app }}
        run: test -f "${{ matrix.deploy_config }}"

      - name: Apply ${{ matrix.label }} Secrets Store bindings
        run: >
          bun run deploy:apply-secrets-store --
          --target staging
          --app "${{ matrix.app }}"
          --config "apps/${{ matrix.app }}/${{ matrix.deploy_config }}"
        env:
          CLOUDFLARE_SECRETS_STORE_ID: ${{ vars.STAGING_CLOUDFLARE_SECRETS_STORE_ID || vars.CLOUDFLARE_SECRETS_STORE_ID }}
          CLOUDFLARE_SECRETS_STORE_PREFIX: ${{ vars.STAGING_CLOUDFLARE_SECRETS_STORE_PREFIX }}

      - name: Verify ${{ matrix.label }} Worker secrets
        run: >
          bun run deploy:check-secrets --
          --app "${{ matrix.app }}"
          --worker "${{ matrix.worker }}"
          --config "apps/${{ matrix.app }}/${{ matrix.deploy_config }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_SECRETS_STORE_REMOTE_CHECK: optional

      - name: Deploy ${{ matrix.label }} to Workers.dev staging
        working-directory: apps/${{ matrix.app }}
        run: bunx wrangler deploy --config "${{ matrix.deploy_config }}" --name "${{ matrix.worker }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke ${{ matrix.label }} staging
        run: bun run deploy:smoke -- --target staging --app "${{ matrix.app }}"
        env:
          STAGING_WEBSITE_URL: ${{ vars.STAGING_WEBSITE_URL }}
          STAGING_PORTAL_URL: ${{ vars.STAGING_PORTAL_URL }}
          STAGING_INTERNAL_URL: ${{ vars.STAGING_INTERNAL_URL }}
          STAGING_DRIVER_URL: ${{ vars.STAGING_DRIVER_URL }}
