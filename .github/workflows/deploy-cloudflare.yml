name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - apps/internal/**
      - apps/portal/**
      - apps/website/**
      - packages/**
      - package.json
      - bun.lock
      - turbo.json
      - .github/workflows/deploy-cloudflare.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: website
            package: '@hyperquote/website'
            label: Website
          - app: portal
            package: '@hyperquote/portal'
            label: Portal
          - app: internal
            package: '@hyperquote/internal'
            label: Internal

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build ${{ matrix.label }}
        run: bun run build --filter=${{ matrix.package }}

      - name: Deploy ${{ matrix.label }}
        working-directory: apps/${{ matrix.app }}
        run: bunx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
