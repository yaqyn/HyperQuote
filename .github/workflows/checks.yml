name: Checks

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  OSV_SCANNER_VERSION: 2.3.8
  SEMGREP_VERSION: 1.162.0

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun run check:ci

      - name: Repository consistency
        run: |
          bun run sync
          bun run knip
          bun run knip:deps
          bun run knip:exports
          bun run scan:arch
          bun run scan:duplicates

      - name: PWA installability
        run: bun run pwa:check

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Local Supabase boundary
        run: |
          bun run db:start
          bun run db:reset
          bun run db:api-boundary

      - name: Install Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "/tmp/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd /tmp && sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt")
          tar -xzf "/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install OSV-Scanner and Semgrep
        run: |
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" -o /tmp/osv-scanner_linux_amd64
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_SHA256SUMS" -o /tmp/osv-scanner_SHA256SUMS
          (cd /tmp && sha256sum --check --ignore-missing osv-scanner_SHA256SUMS)
          sudo install -m 0755 /tmp/osv-scanner_linux_amd64 /usr/local/bin/osv-scanner
          pipx install "semgrep==${SEMGREP_VERSION}"
          osv-scanner --version
          semgrep --version

      - name: Secret scan
        run: bun run scan:secrets

      - name: Vulnerability scan
        run: bun run scan:vulns

      - name: Static security scan
        run: bun run scan:semgrep

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bunx turbo build --force --concurrency=1

      - name: Diff whitespace
        run: git diff --check
