name: Checks

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun run check:ci

      - name: Typecheck
        run: bun run typecheck

      - name: App tests
        run: |
          bun run --cwd apps/website test
          bun run --cwd apps/portal test
          bun run --cwd apps/internal test
          bun run --cwd apps/driver test

      - name: Local Supabase boundary
        run: |
          bun run db:start
          bun run db:reset
          bun run db:api-boundary

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: bunx turbo build --force

      - name: Diff whitespace
        run: git diff --check
