<!doctype html>
<html lang="en">
<body style="margin:0;background:#eef2f7;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
	<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Your HyperQuote sign-in link.</div>
	<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef2f7;padding:36px 12px;">
		<tr><td align="center">
			<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#ffffff;border:1px solid #d9e2ee;border-radius:20px;overflow:hidden;box-shadow:0 28px 90px rgba(15,23,42,0.12);">
				<tr><td style="background:#0f172a;padding:28px 32px;color:#ffffff;"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td style="font-size:20px;font-weight:700;">HyperQuote</td><td align="right" style="font-size:12px;color:#cbd5e1;">Sign-in link</td></tr></table></td></tr>
				<tr><td style="padding:34px 34px 10px;"><h1 style="margin:0;font-size:30px;line-height:1.2;color:#0f172a;">Open HyperQuote.</h1><p style="margin:16px 0 0;font-size:16px;line-height:1.7;color:#475569;">This one-time link signs you in to HyperQuote. It expires shortly and can only be used once.</p></td></tr>
				<tr><td style="padding:24px 34px 34px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;border-radius:12px;background:#0f172a;color:#ffffff;font-size:14px;font-weight:700;text-decoration:none;padding:13px 18px;">Sign in</a><p style="margin:24px 0 0;font-size:13px;line-height:1.7;color:#64748b;word-break:break-all;">{{ .ConfirmationURL }}</p></td></tr>
			</table>
		</td></tr>
	</table>
</body>
</html>
